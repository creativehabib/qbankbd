<!DOCTYPE html>
<html>
<head>
    <script>
    window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        options: {
            ignoreHtmlClass: 'tex2jax_ignore',
            processHtmlClass: 'tex2jax_process'
        }
    };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div id="test1">\((a+b)^2\)</div>
    <div id="test2" class="tex2jax_process">\((a+b)^2\)</div>
</body>
</html>
